name: Validate PlantUML image

on:
  pull_request:
    branches:
      - main

jobs:
  plantuml-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check image update
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range="$BASE_SHA...$HEAD_SHA"
          source_changed=$(git diff --name-only --no-renames "$range" -- docs/architecture.puml)
          image_changed=$(git diff --name-only --no-renames "$range" -- docs/architecture.png)

          if [ -n "$source_changed" ] && [ -z "$image_changed" ]; then
            echo "Update architecture.png when changing architecture.puml."
            exit 1
          fi

          test -s docs/architecture.png
